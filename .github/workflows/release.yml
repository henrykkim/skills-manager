name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="release-notes/$VERSION.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty. Add plain-English release notes before tagging."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodegen generate
          xcodebuild -project SkillsManager.xcodeproj -scheme SkillsManager \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SU_AUTOMATIC_CHECKS=YES \
            CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" build
          codesign --verify --deep --strict --verbose=2 "build/Build/Products/Release/Skills Manager.app"
          scripts/check-update-settings.sh "build/Build/Products/Release/Skills Manager.app" YES
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Re-sign Sparkle for notarization
        run: |
          APP="build/Build/Products/Release/Skills Manager.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          ID="Developer ID Application"
          SIGN=(codesign -f -s "$ID" -o runtime --timestamp)
          "${SIGN[@]}" "$FW/Versions/B/XPCServices/Installer.xpc"
          "${SIGN[@]}" --preserve-metadata=entitlements "$FW/Versions/B/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$FW/Versions/B/Autoupdate"
          "${SIGN[@]}" "$FW/Versions/B/Updater.app"
          "${SIGN[@]}" "$FW"
          "${SIGN[@]}" --preserve-metadata=entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package DMG
        run: scripts/make-dmg.sh "build/Build/Products/Release/Skills Manager.app" "SkillsManager-$VERSION.dmg"

      - name: Notarize and staple
        env:
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID")
          xcrun notarytool submit "SkillsManager-$VERSION.dmg" "${AUTH[@]}" --wait --output-format json > notary.json || true
          cat notary.json
          ID=$(python3 -c 'import json;print(json.load(open("notary.json"))["id"])')
          STATUS=$(python3 -c 'import json;print(json.load(open("notary.json"))["status"])')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::Apple notarization log"
            xcrun notarytool log "$ID" "${AUTH[@]}"
            echo "::endgroup::"
            rm "$RUNNER_TEMP/AuthKey.p8"
            exit 1
          fi
          xcrun stapler staple "SkillsManager-$VERSION.dmg"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION=$(sed -nE '/sparkle-project\/Sparkle/,/exactVersion/ s/.*exactVersion: *([0-9.]+).*/\1/p' project.yml)
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          DMG="SkillsManager-$VERSION.dmg"
          SIGN_OUT=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$DMG")
          scripts/make-appcast.sh --version "$VERSION" --build "$GITHUB_RUN_NUMBER" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$DMG" \
            --sign-output "$SIGN_OUT" --notes "release-notes/$VERSION.md" --out appcast.xml
          xmllint --noout appcast.xml
          PUB=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "build/Build/Products/Release/Skills Manager.app/Contents/Info.plist")
          SIG=$(sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p' <<< "$SIGN_OUT")
          swift scripts/verify-update-signature.swift "$DMG" "$SIG" "$PUB"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 "SkillsManager-$VERSION.dmg" > "SkillsManager-$VERSION.dmg.sha256"
          gh release create "$GITHUB_REF_NAME" "SkillsManager-$VERSION.dmg" "SkillsManager-$VERSION.dmg.sha256" appcast.xml \
            --title "Skills Manager $VERSION" --generate-notes
