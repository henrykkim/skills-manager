name: SkillsManager
options:
  bundleIdPrefix: com.henrykkim
  deploymentTarget:
    macOS: "14.0"
packages:
  SkillsManagerCore:
    path: SkillsManagerCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: "Skills Manager"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  SkillsManager:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkillsManagerCore
      - sdk: FoundationModels.framework
        weak: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Skills Manager"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
schemes:
  SkillsManager:
    build:
      targets:
        SkillsManager: all
    run:
      config: Debug
