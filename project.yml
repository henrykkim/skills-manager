name: SkillsManager
options:
  bundleIdPrefix: com.henrykkim
  deploymentTarget:
    macOS: "14.0"
packages:
  SkillsManagerCore:
    path: SkillsManagerCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: "Skills Manager"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      # Ad-hoc locally; the release workflow overrides CODE_SIGN_IDENTITY and
      # DEVELOPMENT_TEAM on the xcodebuild command line.
      CODE_SIGN_IDENTITY: "-"
targets:
  SkillsManager:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkillsManagerCore
      - sdk: FoundationModels.framework
        weak: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Skills Manager"
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
schemes:
  SkillsManager:
    build:
      targets:
        SkillsManager: all
    run:
      config: Debug
