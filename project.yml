name: SkillsManager
options:
  bundleIdPrefix: com.henrykkim
  deploymentTarget:
    macOS: "14.0"
packages:
  SkillsManagerCore:
    path: SkillsManagerCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: "Skills Manager"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Automatic updates (Sparkle). The release workflow sets
    # SU_AUTOMATIC_CHECKS=YES; local builds never check on their own.
    SU_FEED_URL: "https://github.com/henrykkim/skills-manager/releases/latest/download/appcast.xml"
    SPARKLE_PUBLIC_KEY: ""
    SU_AUTOMATIC_CHECKS: "NO"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      # Ad-hoc locally; the release workflow overrides CODE_SIGN_IDENTITY and
      # DEVELOPMENT_TEAM on the xcodebuild command line.
      CODE_SIGN_IDENTITY: "-"
      # Xcode injects the get-task-allow debugging entitlement by default;
      # notarization rejects any executable that carries it.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  SkillsManager:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkillsManagerCore
      - package: Sparkle
      - sdk: FoundationModels.framework
        weak: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Skills Manager"
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        SUFeedURL: "$(SU_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: "$(SU_AUTOMATIC_CHECKS)"
        SUAutomaticallyUpdate: false
schemes:
  SkillsManager:
    build:
      targets:
        SkillsManager: all
    run:
      config: Debug
